---
exclude:
  # shfmt doesn't support this file.
  - "other/analysis/run-clang-tidy"
  # Generated file.
  - "CHANGELOG.md"

restylers:
  - astyle:
      image: restyled/restyler-astyle:d7967bcb8b622a98524b7df1da1b02652114cf9a
      arguments: ["--options=other/astyle/astylerc"]
      include:
        - "**/*.c"
        - "**/*.h"
  - autopep8:
      image: restyled/restyler-autopep8:5f451c6f0eaf66f7358cea647af09c3df27b76fd
  - black:
      image: restyled/restyler-black:5f451c6f0eaf66f7358cea647af09c3df27b76fd
  - clang-format:
      image: restyled/restyler-clang-format:v16.0.6
      include:
        - "**/*.cc"
        - "**/*.hh"
  - prettier-markdown:
      image: restyled/restyler-prettier:5f451c6f0eaf66f7358cea647af09c3df27b76fd
  - prettier-yaml:
      image: restyled/restyler-prettier:5f451c6f0eaf66f7358cea647af09c3df27b76fd
  - reorder-python-imports:
      image: restyled/restyler-reorder-python-imports:5f451c6f0eaf66f7358cea647af09c3df27b76fd
  - shellharden:
      image: restyled/restyler-shellharden:5f451c6f0eaf66f7358cea647af09c3df27b76fd
  - shfmt:
      image: restyled/restyler-shfmt:5f451c6f0eaf66f7358cea647af09c3df27b76fd
  - yapf:
      image: restyled/restyler-yapf:5f451c6f0eaf66f7358cea647af09c3df27b76fd
